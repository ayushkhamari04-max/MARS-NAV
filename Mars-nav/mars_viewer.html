
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MARS-NAV | 3D Mars Explorer</title>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #090b12;
            font-family: Arial, sans-serif;
        }

        #cesiumContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mars-button {
            padding: 13px 20px;
            background: linear-gradient(135deg, #ff8a00, #e34b24);
            color: white;
            border: 1px solid #ffbd70;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px #0008;
        }

        .mars-button:hover {
            background: linear-gradient(135deg, #ffad32, #f05b32);
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            padding: 9px 13px;
            border-radius: 6px;
            color: #ffffff;
            background: #111a;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="cesiumContainer"></div>

    <div class="control-panel">
        <button id="jezeroButton" class="mars-button" disabled>
            Loading Mars...
        </button>

        <button id="fullMarsButton" class="mars-button" disabled>
            Return to Full Mars View
        </button>
    </div>

    <div id="status">Initializing Mars Explorer...</div>

    <script>
        // --------------------------------------------------
        // 1. CESIUM CONFIGURATION
        // --------------------------------------------------

        Cesium.Ion.defaultAccessToken = "TOKEN_PLACEHOLDER";

        // Mars reference ellipsoid (metres)
        const marsEllipsoid = new Cesium.Ellipsoid(
            3396190,
            3396190,
            3376200
        );

        // --------------------------------------------------
        // 2. CREATE THE VIEWER
        // --------------------------------------------------

        const viewer = new Cesium.Viewer("cesiumContainer", {
            animation: false,
            timeline: false,
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            fullscreenButton: false,
            infoBox: false,
            selectionIndicator: false,
            baseLayer: false,
            requestRenderMode: false
        });

        viewer.scene.globe.show = false;

        viewer.scene.backgroundColor =
            Cesium.Color.fromCssColorString("#090b12");

        viewer.scene.screenSpaceCameraController.minimumZoomDistance = 10000;
        viewer.scene.screenSpaceCameraController.maximumZoomDistance = 20000000;

        // --------------------------------------------------
        // 3. MARS MODEL
        // --------------------------------------------------

        let marsTileset = null;

        const status = document.getElementById("status");
        const jezeroButton = document.getElementById("jezeroButton");
        const fullMarsButton = document.getElementById("fullMarsButton");

        function updateStatus(message) {
            status.textContent = message;
        }

        // --------------------------------------------------
        // 4. FULL MARS VIEW
        // --------------------------------------------------

        async function showFullMars() {
            if (!marsTileset) return;

            updateStatus("Showing full Mars globe...");

            try {
                await viewer.camera.flyToBoundingSphere(
                    marsTileset.boundingSphere,
                    {
                        duration: 4,
                        offset: new Cesium.HeadingPitchRange(
                            0,
                            -0.5,
                            marsTileset.boundingSphere.radius * 2.5
                        )
                    }
                );

                updateStatus("Mars globe loaded successfully.");
            } catch (error) {
                console.error("Full Mars view error:", error);
                updateStatus("Could not display full Mars view.");
            }
        }

        // --------------------------------------------------
        // 5. EXPLORE JEZERO CRATER
        // --------------------------------------------------

    async function exploreJezero() {
    try {
        if (!marsTileset) {
            updateStatus("Mars model is still loading...");
            return;
        }

        updateStatus("Flying to Jezero Crater...");

        const jezeroPosition = Cesium.Cartesian3.fromDegrees(
            77.5,
            18.4,
            80000,
            marsEllipsoid
        );

        await viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(
        77.5,
        18.4,
        80000,
        marsEllipsoid
    ),
    orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-90),
        roll: 0
    },
    duration: 5
});

        viewer.scene.requestRender();
        // JEZERO CRATER MARKER
if (!viewer.entities.getById("jezero-marker")) {
    viewer.entities.add({
        id: "jezero-marker",
        position: Cesium.Cartesian3.fromDegrees(
            77.5, 18.4, 0, marsEllipsoid
        ),
        point: {
            pixelSize: 14,
            color: Cesium.Color.ORANGE,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 3
        },
        label: {
            text: "JEZERO CRATER",
            font: "bold 18px sans-serif",
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -55)
        }
    });
}

// PERSEVERANCE LANDING SITE (approximate coordinates)
if (!viewer.entities.getById("perseverance-marker")) {
    viewer.entities.add({
        id: "perseverance-marker",
        position: Cesium.Cartesian3.fromDegrees(
            77.4509, 18.4447, 0, marsEllipsoid
        ),
        point: {
            pixelSize: 10,
            color: Cesium.Color.LIME,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2
        },
        label: {
            text: "PERSEVERANCE LANDING SITE",
            font: "14px sans-serif",
            fillColor: Cesium.Color.LIME,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, 50)
        }
    });
}

        updateStatus("Jezero Crater exploration view");

        console.log("Jezero camera movement completed.");

    } catch (error) {
        console.error("Jezero camera error:", error);
        updateStatus("Unable to reach Jezero. Check the browser console.");
    }
}

        // --------------------------------------------------
        // 6. LOAD THE MARS 3D TILESET
        // --------------------------------------------------

        async function initializeMars() {
            try {
                updateStatus("Loading Mars 3D model...");

                marsTileset = await Cesium.Cesium3DTileset.fromIonAssetId(
                    3644333
                );

                viewer.scene.primitives.add(marsTileset);

                await marsTileset.readyPromise;
                marsTileset.maximumScreenSpaceError = 8;
marsTileset.dynamicScreenSpaceError = true;
marsTileset.skipLevelOfDetail = false;
                console.log("Mars bounding sphere:", marsTileset.boundingSphere);
console.log("Mars tileset transform:", marsTileset.root.transform);
console.log("Mars tileset URL:", marsTileset.url);
console.log("Mars bounding sphere:", marsTileset.boundingSphere);

                console.log("Mars model loaded:", marsTileset);
                console.log(
                    "Mars bounding sphere:",
                    marsTileset.boundingSphere
                );

                jezeroButton.disabled = false;
                fullMarsButton.disabled = false;

                jezeroButton.textContent = "Explore Jezero Crater";

                await showFullMars();

                console.log("Cesium Mars loaded successfully!");

            } catch (error) {
                console.error("Mars loading error:", error);

                updateStatus("Mars failed to load. Check your Cesium token.");

                jezeroButton.textContent = "Mars Loading Failed";
            }
        }

        // --------------------------------------------------
        // 7. BUTTON EVENTS
        // --------------------------------------------------

        jezeroButton.addEventListener("click", exploreJezero);

        fullMarsButton.addEventListener("click", showFullMars);

        // --------------------------------------------------
        // 8. START THE APPLICATION
        // --------------------------------------------------

        initializeMars();

    </script>

</body>
</html>
